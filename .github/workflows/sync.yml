name: Sync with Upstream

on:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight UTC
  workflow_dispatch:  # Allows manual triggering from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Ensures full history is available

      - name: Add upstream remote
        run: git remote add upstream https://github.com/projectchrono/chrono.git

      - name: Fetch upstream changes
        run: git fetch upstream

      - name: Merge upstream/main into main
        run: git merge upstream/main --no-edit --allow-unrelated-histories
        continue-on-error: true  # Allows the workflow to continue if merge fails (e.g., due to conflicts)

      - name: Check for merge conflicts
        run: |
          if [ "$(git status --porcelain)" ]; then
            echo "Merge conflicts detected. Please resolve manually."
            exit 1
          fi

      - name: Push changes
        run: git push
